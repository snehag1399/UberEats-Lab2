# UberEats Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubereats-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ubereats
  template:
    metadata:
      labels:
        app: ubereats
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      initContainers:
      - name: init-kafka-topics
        image: snehag1399/ubereats-backend:latest
        command: ['npm', 'run', 'init-topics']
        env:
        - name: KAFKA_BROKER
          value: "kafka-service:9092"
      containers:
      - name: ubereats
        image: snehag1399/ubereats-backend:latest
        ports:
        - containerPort: 5001
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          value: "mongodb://mongodb-service:27017/ubereats"
        - name: KAFKA_BROKER
          value: "kafka-service:9092"
        - name: JWT_SECRET
          value: "3e8b985b70290f1686ee27d68d5fa8078339654a40e2f880f27697da5db94785"
        - name: PORT
          value: "5001"
---
# UberEats Service
apiVersion: v1
kind: Service
metadata:
  name: ubereats-service
spec:
  selector:
    app: ubereats
  ports:
  - protocol: TCP
    port: 5001
    targetPort: 5001
  type: LoadBalancer
---
# MongoDB Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6.0
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc
---
# MongoDB Service
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  selector:
    app: mongodb
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
---
# MongoDB Persistent Volume Claim (Fixed with storageClassName)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc   # <--- ✅ IMPORTANT (use CSI driver)
  resources:
    requests:
      storage: 1Gi
---
# Zookeeper Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:latest
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
---
# Zookeeper Service
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
spec:
  selector:
    app: zookeeper
  ports:
  - protocol: TCP
    port: 2181
    targetPort: 2181
---
# Kafka Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:latest
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-service:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
---
# Kafka Service
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
spec:
  selector:
    app: kafka
  ports:
  - protocol: TCP
    port: 9092
    targetPort: 9092
